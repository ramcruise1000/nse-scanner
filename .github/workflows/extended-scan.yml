# Vol5 — Extended-Hours Dual-Frame 1:5 RR Scanner
# Standalone companion to Vol4 (market-sweep.yml). ISOLATED: runs in its own concurrency
# group so it never blocks or collides with the existing Vol4 scan.
#
# Schedule (GitHub cron is ALWAYS UTC; converted below to IST):
#   09:30-14:30 IST  ->  04:00-09:00 UTC   (signal generation window)
#   15:10, 15:20 IST ->  09:40, 09:50 UTC   (journal finalize passes)
#   15:35, 15:45 IST ->  10:05, 10:15 UTC   (finalize safety nets)
#
# Edit settings in scanner_v5.py (capital/risk, window size, strategies); no
# changes to this file are normally needed. If you only see runs when you click
# Run workflow yourself, see SOP Section "Scheduled runs not firing" (Section 11).

name: Vol5 Extended-Hour Scanner

on:
  schedule:
    - cron: "*/10 4-9 * * 1-5"
    - cron: "40,50 9 * * 1-5"
    - cron: "5,15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Mode: live (writes to repo) or test (ephemeral staging)'
        required: false
        default: 'live'
      force_time:
        description: 'SCANNER_FORCE_TIME HH:MM override for dry-run stepping'
        required: false
        default: ''
      test_limit:
        description: 'SCANNER_TEST_LIMIT N symbols for debug (leave empty in production)'
        required: false
        default: ''

concurrency:
  group: vol5-extended
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  GIT_AUTHOR_NAME: vol5-bot
  GIT_AUTHOR_EMAIL: vol5@bot.local
  GIT_COMMITTER_NAME: vol5-bot
  GIT_COMMITTER_EMAIL: vol5@bot.local

jobs:
  vol5-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Vol5 scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'live' }}
          SCANNER_FORCE_TIME: ${{ github.event.inputs.force_time }}
          SCANNER_TEST_LIMIT: ${{ github.event.inputs.test_limit }}
        run: python scanner_v5.py

      - name: Commit reports, journals and memory back to the repository
        # Keeps the journal, report, state and tuning memory version-controlled so the
        # system learns from session to session without any manual intervention.
        run: |
          git config --global user.name "${GIT_AUTHOR_NAME}"
          git config --global user.email "${GIT_AUTHOR_EMAIL}"
          git add journal_v5/ reports_v5/ state_v5.json tuner_state_v5.json 2>/dev/null || true
          git commit -m "Vol5 EOD update $(date -u '+%Y-%m-%d %H:%M UTC')" --allow-empty || true
          git push origin HEAD:${{ github.ref_name }} || true
