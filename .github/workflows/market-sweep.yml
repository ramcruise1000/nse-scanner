name: market-sweep
 
# NSE F&O Intraday Scanner (SOP Volume IV)
# GitHub cron is ALWAYS in UTC. IST = UTC + 5:30.
# "*/10 3-9 * * 1-5" fires every 10 minutes from 03:00 to 09:50 UTC,
# which is 08:30 to 15:20 IST, Monday to Friday.
# The scanner script reads the IST clock itself and exits quickly
# whenever there is nothing to do, so extra firings cost ~10 seconds.
 
on:
  schedule:
    - cron: "*/10 3-9 * * 1-5"
  workflow_dispatch: {}   # the manual "Run workflow" button
 
permissions:
  contents: write         # needed to commit the reports
 
concurrency:
  group: market-sweep     # never run two sweeps at once
  cancel-in-progress: false
 
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Run the scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
 
      - name: Commit the reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "scanner run [skip ci]"
